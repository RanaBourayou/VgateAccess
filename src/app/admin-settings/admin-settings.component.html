<!-- admin-settings.component.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VGateAccess - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Poppins:wght@400;500;600;700&display=swap">
</head>
<body>
    <!-- Sidebar Navigation -->
    <app-sidebar-dashboard></app-sidebar-dashboard>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Topbar with Logout Dropdown -->
        <app-header-dashboard></app-header-dashboard>

        <!-- Content Area -->
        <div class="content">
            <div class="page-header">
                <div class="page-title">
                    <h1>Admin Settings</h1>
                </div>
            </div>

            <!-- Settings Card -->
            <div class="settings-card">
                <h2><i class="fas fa-clock"></i> Allowed Visit Hours</h2>
                
                <div class="settings-form">
                    <form [formGroup]="hoursForm" (ngSubmit)="saveVisitHours()">
                        <div class="form-group">
                            <label for="startHour">Start Hour (0-23):</label>
                            <input type="number" id="startHour" formControlName="startHour" 
                                min="0" max="23" placeholder="8">
                            <div *ngIf="hoursForm.get('startHour')?.invalid && hoursForm.get('startHour')?.touched"
                                class="error-message">
                                Valid hour required (0-23)
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="endHour">End Hour (0-23):</label>
                            <input type="number" id="endHour" formControlName="endHour" 
                                min="0" max="23" placeholder="17">
                            <div *ngIf="hoursForm.get('endHour')?.invalid && hoursForm.get('endHour')?.touched"
                                class="error-message">
                                Valid hour required (0-23)
                            </div>
                        </div>
                        
                        <button type="submit" class="btn-save" 
                            [disabled]="hoursForm.invalid">
                            <i class="fas fa-save"></i> Save Hours
                        </button>
                        
                        <div *ngIf="savedSuccessfully" class="success-message">
                            <i class="fas fa-check-circle"></i> Hours saved successfully!
                        </div>
                    </form>
                    
                    <div class="current-hours" *ngIf="currentHours">
                        <strong>Current Allowed Hours:</strong> {{ currentHours }}
                    </div>
                </div>
            </div>

            <!-- Other Admin Actions -->
            <div class="admin-actions">
                <div class="action-card">
                    <h3><i class="fas fa-calendar-plus"></i> Create Visit Request</h3>
                    <p>Create a new visit request in receptionist mode</p>
                    <button mat-raised-button color="primary" (click)="openCreateVisitDialog()">
                        Open Creation Dialog
                    </button>
                </div>
                
                <div class="action-card">
                    <h3><i class="fas fa-check-double"></i> Mark Visits Complete</h3>
                    <p>Mark all unfinished visits as COMPLETED</p>
                    <button class="btn-warning" (click)="markAllVisitsCompleted()">
                        <i class="fas fa-check-circle"></i> Mark All Completed
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
