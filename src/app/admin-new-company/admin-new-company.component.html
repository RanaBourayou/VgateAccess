<div class="form-container">
  <h2>Add New Company</h2>
  
  <form [formGroup]="companyForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="companyName">Company Name*</label>
      <input 
        type="text" 
        id="companyName" 
        formControlName="companyName"
        placeholder="Enter company name"
      >
      <div *ngIf="companyForm.get('companyName')?.invalid && companyForm.get('companyName')?.touched" class="error-message">
        <div *ngIf="companyForm.get('companyName')?.errors?.['required']">
          Company name is required
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="companyAddress">Company Address*</label>
      <input 
        type="text" 
        id="companyAddress" 
        formControlName="companyAddress"
        placeholder="Enter address"
      >
      <div *ngIf="companyForm.get('companyAddress')?.invalid && companyForm.get('companyAddress')?.touched" class="error-message">
        <div *ngIf="companyForm.get('companyAddress')?.errors?.['required']">
          Address is required
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="companyEmail">Company Email*</label>
      <input 
        type="email" 
        id="companyEmail" 
        formControlName="companyEmail"
        placeholder="Enter email"
      >
      <div *ngIf="companyForm.get('companyEmail')?.invalid && companyForm.get('companyEmail')?.touched" class="error-message">
        <div *ngIf="companyForm.get('companyEmail')?.errors?.['required']">
          Email is required
        </div>
        <div *ngIf="companyForm.get('companyEmail')?.errors?.['email']">
          Invalid email format
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="companyPhone">Company Phone*</label>
      <input 
        type="tel" 
        id="companyPhone" 
        formControlName="companyPhone"
        placeholder="Enter phone number"
      >
      <div *ngIf="companyForm.get('companyPhone')?.invalid && companyForm.get('companyPhone')?.touched" class="error-message">
        <div *ngIf="companyForm.get('companyPhone')?.errors?.['required']">
          Phone is required
        </div>
        <div *ngIf="companyForm.get('companyPhone')?.errors?.['pattern']">
          Invalid phone number format
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button 
        type="submit" 
        [disabled]="companyForm.invalid || isLoading"
        class="submit-btn"
      >
        <span *ngIf="!isLoading">Create Company</span>
        <span *ngIf="isLoading">Creating...</span>
      </button>
      <button 
        type="button" 
        (click)="onCancel()"
        class="cancel-btn"
      >
        Cancel
      </button>
    </div>
  </form>
</div>
