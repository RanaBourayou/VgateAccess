<div class="edit-company-form">
  <h2>Edit Company</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="company">
    <div class="form-group">
      <label for="name">Company Name</label>
      <input type="text" id="name" formControlName="companyName" />
      <div *ngIf="form.get('companyName')?.invalid && form.get('companyName')?.touched" class="error">
        <span *ngIf="form.get('companyName')?.errors?.['required']">Company name is required.</span>
        <span *ngIf="form.get('companyName')?.errors?.['maxlength']">Max 100 characters allowed.</span>
      </div>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" formControlName="companyEmail" />
      <div *ngIf="form.get('companyEmail')?.invalid && form.get('companyEmail')?.touched" class="error">
        <span *ngIf="form.get('companyEmail')?.errors?.['required']">Email is required.</span>
        <span *ngIf="form.get('companyEmail')?.errors?.['email']">Enter a valid email address.</span>
      </div>
    </div>
    <div class="form-group">
      <label for="address">Address</label>
      <input type="text" id="address" formControlName="companyAddress" />
      <div *ngIf="form.get('companyAddress')?.invalid && form.get('companyAddress')?.touched" class="error">
        <span *ngIf="form.get('companyAddress')?.errors?.['maxlength']">Max 200 characters allowed.</span>
      </div>
    </div>
    <div class="form-group">
      <label for="phone">Phone</label>
      <input type="text" id="phone" formControlName="companyPhone" />
      <div *ngIf="form.get('companyPhone')?.invalid && form.get('companyPhone')?.touched" class="error">
        <span *ngIf="form.get('companyPhone')?.errors?.['pattern']">Enter a valid phone number.</span>
        <span *ngIf="form.get('companyPhone')?.errors?.['maxlength']">Max 20 characters allowed.</span>
      </div>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || loading">Update Company</button>
  </form>

  <div *ngIf="loading">Updating...</div>
  <div *ngIf="error" class="error">{{ error }}</div>
  <div *ngIf="success" class="success">Company updated successfully!</div>
</div>
