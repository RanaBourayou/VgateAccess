<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Change Password - Decor & Developpement</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* Paste your entire Sign In CSS here */
    /* === Begin Sign In CSS === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0a192f 0%, #0d1b36 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #ffffff;
    }

    .reset-container {
      background: linear-gradient(135deg, #121f3a 0%, #0e1729 100%);
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      padding: 40px;
      width: 100%;
      max-width: 450px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 157, 0, 0.2);
    }

    .reset-container::before {
      content: "";
      position: absolute;
      top: -50px;
      right: -50px;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: rgba(255, 157, 0, 0.05);
      z-index: 0;
    }

    .reset-container::after {
      content: "";
      position: absolute;
      bottom: -80px;
      left: -30px;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: rgba(255, 157, 0, 0.03);
      z-index: 0;
    }

    .logo-container {
      text-align: left;
      margin-bottom: 40px;
      position: relative;
      z-index: 2;
    }

    .logo {
      width: 220px;
      height: auto;
      filter: brightness(0) invert(1);
    }

    .reset-card {
      position: relative;
      z-index: 2;
    }

    .reset-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .reset-header h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 10px;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .reset-header p {
      color: #a0aec0;
      font-size: 16px;
      font-weight: 300;
    }

    .form-group {
      position: relative;
      margin-bottom: 25px;
    }

    input.form-style {
      width: 100%;
      padding: 15px 15px 15px 50px;
      border: 1px solid #2d3748;
      border-radius: 10px;
      background: #1a202c;
      font-size: 16px;
      color: #ffffff;
      transition: all 0.3s ease;
      height: 52px;
    }

    input.form-style:focus {
      outline: none;
      border-color: #ff9d00;
      background: #1e293b;
      box-shadow: 0 0 0 3px rgba(255, 157, 0, 0.2);
    }

    input.form-style::placeholder {
      color: #718096;
      font-weight: 400;
    }

    .input-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #ff9d00;
      font-size: 20px;
    }

    button.btn {
      background: linear-gradient(135deg, #ff9d00 0%, #ff7b00 100%);
      color: #0a192f;
      border: none;
      border-radius: 10px;
      padding: 16px;
      width: 100%;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(255, 157, 0, 0.3);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-family: 'Montserrat', sans-serif;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    button.btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 100%;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.4s ease;
      z-index: -1;
    }

    button.btn:hover::before {
      width: 100%;
    }

    button.btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255, 157, 0, 0.4);
    }

    p.error {
      color: #ff6b6b;
      font-weight: 600;
      text-align: center;
      margin-top: 10px;
    }

    p.success {
      color: #6bcf63;
      font-weight: 600;
      text-align: center;
      margin-top: 10px;
    }

    /* Responsive adjustments */
    @media (max-width: 500px) {
      .reset-container {
        padding: 30px 20px;
      }

      .reset-header h2 {
        font-size: 28px;
      }

      .logo {
        width: 180px;
      }
    }
    /* === End Sign In CSS === */
  </style>
</head>
<body>
  <div class="reset-container">
     

    <div class="reset-card">
      <div class="reset-header">
        <h2>Change Password</h2>
        <p>Please enter your email and passwords below.</p>
      </div>

<form (ngSubmit)="changePassword()" [formGroup]="changePasswordForm" autocomplete="off" novalidate>
  <div class="form-group">
    <i class="input-icon fas fa-envelope"></i>
    <input
      type="email"
      formControlName="email"
      placeholder="Email"
      class="form-style"
      required
      autocomplete="off"
    />
  </div>

  <div class="form-group">
    <i class="input-icon fas fa-lock"></i>
    <input
      type="password"
      formControlName="oldPassword"
      placeholder="Current Password"
      class="form-style"
      required
      autocomplete="off"
    />
  </div>

  <div class="form-group">
    <i class="input-icon fas fa-lock"></i>
    <input
      type="password"
      formControlName="newPassword"
      placeholder="New Password"
      class="form-style"
      required
      autocomplete="off"
    />
  </div>

  <div class="form-group">
    <i class="input-icon fas fa-lock"></i>
    <input
      type="password"
      formControlName="confirmPassword"
      placeholder="Confirm New Password"
      class="form-style"
      required
      autocomplete="off"
    />
  </div>

  <button type="submit" class="btn">Change Password</button>

  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
</form>

    </div>
  </div>

  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
